trigger:
  - main

pool: Infra-Self-hosted

stages:
  - stage: Scan
    displayName: TerraforSecurityScan

    jobs:
    - job: ScanJob
      steps: 
        - script: |
            where tflint
            where tfsec
            where gitleaks
            where checkov

            tflint --version
            tfsec --version
            gitleaks version
            checkov --version
          displayName: 'Verify Security Tools'

        # script to download security tools  
